name: Datos diarios CAFCI

on:
  schedule:
    # 01:30 UTC = 22:30 hora argentina, después del cierre de CAFCI (~21 hs)
    - cron: "30 1 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

# Nunca dos corridas a la vez (la vigilancia puede relanzarla).
concurrency:
  group: datos-diarios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Bajar y procesar planilla
        run: python pipeline/actualizar.py
      - name: Indicadores BCRA
        continue-on-error: true
        run: python pipeline/bcra.py
      - name: Análisis (atado a, subtipo, activos, gestoras, precios BYMA de la calculadora)
        continue-on-error: true
        run: python pipeline/analisis.py
      - name: Rendimientos por período
        continue-on-error: true
        run: python pipeline/historico.py
      - name: Datos de la página (catálogo y fichas)
        continue-on-error: true
        run: python pipeline/web.py
      - name: Guardar datos
        run: |
          git config user.name "datos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Datos CAFCI $(date -u +%F)"
          # Si otra corrida guardó al mismo tiempo, reintenta (hasta 4 veces)
          for i in 1 2 3 4; do
            git pull --rebase -X theirs && git push && exit 0
            echo "Push falló, reintento en $((i * 15)) s"; sleep $((i * 15))
          done
          exit 1
