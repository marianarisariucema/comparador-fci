name: Datos diarios CAFCI

on:
  schedule:
    # 01:30 UTC = 22:30 hora argentina, después del cierre de CAFCI (~21 hs)
    - cron: "30 1 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Bajar y procesar planilla
        run: python pipeline/actualizar.py
      - name: Indicadores BCRA
        continue-on-error: true
        run: python pipeline/bcra.py
      - name: Calculadora de renta fija (para tasas de bonos y letras)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: marianarisariucema/calculadora-renta-fija
          path: calc
      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: "20"
      - name: Tasas y duración de bonos y letras (lee las tablas de la calculadora)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          npm i --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
          node pipeline/tasas.js calc data/tasas/ultimo.json
          rm -rf node_modules calc
      - name: Análisis (atado a, subtipo, activos, gestoras, precios BYMA de la calculadora)
        continue-on-error: true
        run: python pipeline/analisis.py
      - name: Rendimientos por período
        continue-on-error: true
        run: python pipeline/historico.py
      - name: Datos de la página (catálogo y fichas)
        continue-on-error: true
        run: python pipeline/web.py
      - name: Guardar datos
        run: |
          git config user.name "datos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Datos CAFCI $(date -u +%F)"
          git pull --rebase -X theirs
          git push
