name: Carteras semanales CNV

on:
  schedule:
    # Sábados 12:00 UTC (9:00 hora argentina). La CNV publica la cartera semanal con atraso.
    - cron: "0 12 * * 6"
  workflow_dispatch:
    inputs:
      ids:
        description: "IDs de la CNV separados por espacio (vacío = todos los abiertos)"
        required: false

permissions:
  contents: write

jobs:
  carteras:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Bajar carteras
        run: python pipeline/carteras_cnv.py ${{ github.event.inputs.ids && format('--ids {0}', github.event.inputs.ids) || '' }}
      - name: Guardar datos
        run: |
          git config user.name "datos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Carteras CNV $(date -u +%F)"
          git pull --rebase
          git push
