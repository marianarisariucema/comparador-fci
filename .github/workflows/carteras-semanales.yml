name: Carteras semanales CNV

on:
  schedule:
    # Sábados 05:00 UTC (2:00 hora argentina, de noche). La CNV publica la cartera semanal con atraso.
    - cron: "0 5 * * 6"
  workflow_dispatch:
    inputs:
      ids:
        description: "IDs de la CNV separados por espacio (vacío = todos los abiertos)"
        required: false

permissions:
  contents: write

jobs:
  carteras:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Bajar carteras
        # ~1.700 fondos tardan más de 90 min. Si se corta, igual se guarda lo bajado.
        timeout-minutes: 300
        continue-on-error: true
        run: python pipeline/carteras_cnv.py ${{ github.event.inputs.ids && format('--ids {0}', github.event.inputs.ids) || '' }}
      - name: Guardar datos
        if: always()
        run: |
          git config user.name "datos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Carteras CNV $(date -u +%F)"
          # Si otra corrida guardó al mismo tiempo, reintenta (hasta 4 veces)
          for i in 1 2 3 4; do
            git pull --rebase -X theirs && git push && exit 0
            echo "Push falló, reintento en $((i * 15)) s"; sleep $((i * 15))
          done
          exit 1
