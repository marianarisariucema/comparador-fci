# API de datos para clientes (ALyCs). Cloudflare Workers, plan gratis (100.000 pedidos por día).
# Se despliega solo cada noche desde GitHub Actions (.github/workflows/api-desplegar.yml).
name = "fondos-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Los datos (data/web) y el componente se suben como archivos del Worker, pero NUNCA se sirven directo:
# run_worker_first hace que cada pedido pase por el control de clave, dominio y límite de src/app.js.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[vars]
# Clave pública de la demo (es pública a propósito: solo ve fondos de muestra desde dominios permitidos).
DEMO_CLAVE_PUBLICA = "pk_demo_tUoV82LwSL6icmg-Wgkpw593JBfwrlHo"

[observability]
enabled = true

# Límite global por cliente e IP (opcional, recomendado). Descomentar si la cuenta lo tiene habilitado.
# [[ratelimits]]
# name = "LIMITE"
# namespace_id = "1001"
# simple = { limit = 300, period = 60 }

# Secreto que firma tokens y huellas. Se carga una vez con:  npx wrangler secret put FIRMA_SECRETA
# (el workflow lo carga solo desde el secreto de GitHub FIRMA_SECRETA).
