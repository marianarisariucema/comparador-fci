<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fondos explicados</title>
<meta name="description" content="Fondos comunes de inversión explicados en simple: qué son, en qué invierten, a qué está atada tu plata y cómo les fue.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Módulo marca blanca: lista de fondos + ficha didáctica.
   Marca y color por URL: ?marca=Mi%20Broker&color=%230f6b5c
   Ficha sola para embeber en otra web: ?fondo=fima-premium&embed=1 */
:root{
  --bg:#f4f6f5; --surface:#fff; --sunk:#eef2f0; --ink:#15201c; --muted:#5b6964; --line:#dde3e0;
  --brand:#0f6b5c; --accent:var(--brand); --brand-ink:#fff; --brand-soft:#e3f1ed; --good:#1d7a45; --bad:#b4372b; --warn:#a36a00;
  --c2:#3f8fd1; --c3:#d39a2b; --c4:#8a5cc2; --c5:#c4553d; --c6:#7a8a84; --c7:#2f9e8f; --c8:#b07aa1;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --radius:16px; --shadow:0 1px 2px rgba(20,32,28,.04),0 4px 16px rgba(20,32,28,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#17201d; --sunk:#121a17; --accent:#4cc2a8; --ink:#e7eeeb; --muted:#9aaba5; --line:#2a3632;
  --brand-soft:#173430; --good:#5cc98a; --bad:#ef7d70; --warn:#e3b04f; --shadow:none;
  --c2:#6fb2ec; --c3:#e3b04f; --c4:#b18ae6; --c5:#ef7d70; --c6:#93a39d; --c7:#5fc7b8; --c8:#d39ac4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#17201d; --sunk:#121a17; --accent:#4cc2a8; --ink:#e7eeeb; --muted:#9aaba5; --line:#2a3632;
  --brand-soft:#173430; --good:#5cc98a; --bad:#ef7d70; --warn:#e3b04f; --shadow:none;
  --c2:#6fb2ec; --c3:#e3b04f; --c4:#b18ae6; --c5:#ef7d70; --c6:#93a39d; --c7:#5fc7b8; --c8:#d39ac4; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{background:var(--brand);color:var(--brand-ink);padding:14px max(16px,env(safe-area-inset-left))}
.top-in{max-width:920px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top b{font-weight:700;letter-spacing:.01em;font-size:1.05rem}
.top small{opacity:.85;font-size:.8rem}
main{max-width:920px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left)) 56px;display:grid;gap:20px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(1.5rem,4.5vw,2rem);letter-spacing:-.01em}
h2{font-size:clamp(1.3rem,4vw,1.6rem);letter-spacing:-.01em}
h3{font-size:.76rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.peq{color:var(--muted);font-size:.87rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
/* glosario */
.t{background:none;border:0;padding:0;cursor:help;text-align:left;text-decoration:underline dotted;text-decoration-color:var(--muted);text-underline-offset:3px;font-weight:inherit}
.t:hover{color:var(--accent)}
#glosa{position:fixed;inset:auto 12px 12px 12px;max-width:460px;margin:0 auto;z-index:20;padding:16px 18px;display:none;gap:6px}
#glosa.abierto{display:grid}
#glosa b{font-size:1rem}
#glosa .cerrar{position:absolute;top:8px;right:10px;background:none;border:0;font-size:1.3rem;cursor:pointer;color:var(--muted);line-height:1}
/* portada */
.hero{display:grid;gap:12px}
.hero p{max-width:62ch;color:var(--muted)}
.queesfci{padding:16px 18px;display:grid;gap:6px;background:var(--brand-soft);border-color:transparent}
.queesfci p{color:var(--ink);font-size:.93rem}
.objetivos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,135px),1fr));gap:10px}
.obj{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;display:grid;gap:2px;box-shadow:var(--shadow)}
.obj b{font-size:.95rem}
.obj span{color:var(--muted);font-size:.8rem;line-height:1.35}
.obj[aria-pressed="true"]{border-color:var(--accent);background:var(--brand-soft)}
.obj[aria-pressed="true"] b{color:var(--accent)}
.buscar input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1rem}
.orden{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.orden select{font:inherit;font-size:.85rem;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.lista{overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:14px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.item:last-child{border-bottom:0}
.item:hover{background:var(--sunk)}
.item .n{font-weight:600;font-size:1rem}
.item .g{color:var(--muted);font-size:.82rem}
.item .r{text-align:right;grid-row:span 2;align-self:center;white-space:nowrap}
.item .r .num{font-weight:600;font-size:1.02rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.mas{justify-self:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 18px;cursor:pointer}
.vacio{padding:24px 16px;color:var(--muted)}
/* medidor de riesgo */
.riesgo{display:inline-flex;gap:3px;align-items:center}
.riesgo i{width:7px;height:7px;border-radius:2px;background:var(--line);display:block}
.riesgo i.on{background:var(--rc)}
.riesgo.grande i{width:22px;height:8px;border-radius:4px}
.rv1,.rv2{--rc:var(--good)}.rv3{--rc:var(--warn)}.rv4,.rv5{--rc:var(--bad)}
/* ficha */
.volver{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:600;justify-self:start}
.ficha{padding:clamp(18px,4vw,28px);display:grid;gap:30px}
.cab{display:grid;gap:8px}
.frase{font-size:1.12rem;line-height:1.5;max-width:60ch}
.paraque{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--brand-soft);font-size:.93rem}
.paraque b{color:var(--accent);white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:24px}
.bloque{display:grid;gap:10px;align-content:start;min-width:0}
.dato{font-size:1.55rem;font-weight:600;line-height:1.15}
.barra{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line);gap:2px}
.barra span{display:block;height:100%}
.leyenda{display:grid;gap:6px;font-size:.9rem}
.leyenda div{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center}
.leyenda i{width:12px;height:12px;border-radius:3px;display:block}
table{width:100%;border-collapse:collapse;font-size:.88rem}
td,th{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
td:last-child,th:last-child{text-align:right;padding-left:12px}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
.scroll table{min-width:340px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font-size:.82rem;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer}
.tabs button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600;background:var(--brand-soft)}
.sim{display:grid;gap:14px;padding:18px;border-radius:14px;background:var(--sunk)}
.sim label{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.93rem}
.sim input{font:inherit;font-family:var(--mono);width:9.5em;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.sim .grande{font-size:clamp(1.6rem,6vw,2.1rem);font-weight:700;line-height:1.1}
.comp{display:grid;gap:9px}
.comp-row{display:grid;grid-template-columns:minmax(96px,150px) 1fr 74px;gap:10px;align-items:center;font-size:.88rem}
.track{height:12px;background:var(--line);border-radius:6px;position:relative;overflow:hidden}
.fill{position:absolute;top:0;bottom:0;left:0;border-radius:6px;background:var(--c6)}
.comp-row.fondo .fill{background:var(--accent)}
.comp-row .fill.neg{background:var(--bad)}
.veredicto{font-weight:600}
.pos{color:var(--good)}.neg{color:var(--bad)}
.graf svg{width:100%;height:auto;display:block;overflow:visible}
.graf .eje{stroke:var(--line)}
.graf text{fill:var(--muted);font-size:11px;font-family:var(--sans)}
.ley2{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.ley2 i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.senales{list-style:none;margin:0;padding:0;display:flex;gap:8px;flex-wrap:wrap}
.senales li{font-size:.82rem;padding:6px 10px;border-radius:10px;background:var(--sunk);color:var(--muted)}
.senales li.aten{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--ink)}
.senales li.aten::before{content:"⚠ ";color:var(--warn)}
.btncmp{justify-self:start;margin-top:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.84rem;cursor:pointer}
.btncmp[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--brand-soft)}
#cmpbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));z-index:15;display:flex;gap:14px;align-items:center;padding:8px 8px 8px 18px;border-radius:999px;background:var(--ink);color:var(--bg);box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:.88rem;white-space:nowrap}
#cmpbar[hidden]{display:none}
#cmpbar a{background:var(--brand);color:var(--brand-ink);text-decoration:none;font-weight:600;padding:6px 14px;border-radius:999px}
.cmp table{min-width:520px}.cmp td,.cmp th{padding:10px 12px;text-align:left!important;vertical-align:top}
.cmp th a{color:var(--ink);font-size:.95rem;text-transform:none;letter-spacing:0;text-decoration:none;font-weight:700}
.cmp td:first-child{color:var(--muted);font-size:.84rem;min-width:110px}
.quitar{background:none;border:0;padding:0;color:var(--muted);font-size:.75rem;text-decoration:underline;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:400}
.cmp .chip{background:var(--brand-soft);color:var(--accent)}
main{padding-bottom:90px}
.aviso{font-size:.76rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
footer{font-size:.76rem;color:var(--muted);text-align:center;max-width:62ch;justify-self:center}
@media (prefers-reduced-motion:no-preference){.barra span,.fill{transition:width .5s ease}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><b id="marca">Fondos explicados</b><small id="fecha"></small></div></header>
<main id="app"><p class="peq">Cargando fondos…</p></main>
<div id="glosa" class="card" role="dialog" aria-live="polite" aria-label="Qué significa"><button class="cerrar" type="button" aria-label="Cerrar">×</button><b></b><p></p></div>
<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const Q=new URLSearchParams(location.search), EMBED=!!Q.get('embed');
const BASE=window.FONDOS_DATOS||'data/web/';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(v,d=1)=>v==null||isNaN(v)?'s/d':v.toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(v,d=1)=>v==null?'s/d':(v>0?'+':'')+nf(v,d)+'%';
const sim=(v,mon)=>(mon==='USD'?'US$ ':'$ ')+Math.round(v).toLocaleString('es-AR');
const plata=(v,mon)=>{if(v==null)return 's/d';const a=Math.abs(v),s=mon==='USD'?'US$ ':'$ ';
  if(a>=1e12)return s+nf(v/1e12,2)+' billones';if(a>=1e9)return s+nf(v/1e9,1)+' mil millones';if(a>=1e6)return s+nf(v/1e6,1)+' millones';return s+nf(v,0)};
const plazo=p=>p==null||p===''?'s/d':+p===0?'en el día':+p===1?'al día hábil siguiente':'en '+p+' días hábiles';
const horiz={Cor:'corto plazo',Med:'mediano plazo',Lar:'largo plazo',Flex:'cualquier plazo'};
const colores=['var(--accent)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c7)','var(--c8)','var(--c6)'];
const fecha=f=>{if(!f)return '';const [y,m,d]=f.split('-');return d+'/'+m+'/'+y};
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const mes=f=>{const [y,m]=f.split('-');return MESES[+m-1]+' '+y};
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

/* ---------- Glosario: cada término técnico se puede tocar para ver qué significa ---------- */
const G={
 fci:['Fondo común de inversión','Mucha gente pone su plata en un mismo pozo y una empresa especializada (la administradora) la invierte por todos. Cada uno puede sacar su parte cuando quiera, según el plazo del fondo.'],
 administradora:['Administradora','La empresa que decide en qué se invierte la plata del fondo. Cobra un porcentaje por año por hacerlo.'],
 depositaria:['Custodia (depositaria)','Un banco que guarda la plata y los activos del fondo, separados de los de la administradora. Si la administradora tuviera problemas, la plata sigue siendo de los inversores.'],
 rescate:['Rescate','Es sacar tu plata del fondo. El plazo de rescate es cuánto tarda en volver a tu cuenta.'],
 patrimonio:['Patrimonio','La plata total que maneja el fondo, sumando la de todos sus inversores.'],
 cer:['CER (inflación)','Un índice que sigue a la inflación. Un bono "CER" te devuelve tu plata ajustada por inflación más un interés.'],
 lecap:['Lecap (tasa fija)','Letras del Tesoro que pagan una tasa fija acordada de antemano. Ganan más si la inflación termina siendo menor a lo esperado.'],
 tamar:['TAMAR','La tasa que pagan los bancos por plazos fijos grandes. Un bono TAMAR paga intereses que suben o bajan con esa tasa.'],
 linked:['Dólar linked','Bonos en pesos que ajustan por el dólar oficial. Si el dólar sube, suben. Se compran y cobran en pesos.'],
 on:['Obligación negociable (ON)','Un préstamo que le hacés a una empresa: te devuelve la plata con intereses en las fechas pactadas.'],
 caucion:['Caución','Un préstamo de muy corto plazo (de 1 a 7 días) con garantía, que se hace en la bolsa. Es de muy bajo riesgo.'],
 plazofijo:['Plazo fijo','Un depósito en un banco a un plazo y tasa fijos. Los fondos de mercado de dinero tienen muchos, en varios bancos.'],
 mm:['Money market (mercado de dinero)','Fondos que invierten en lo más seguro y corto: plazos fijos, cuentas remuneradas y cauciones. La plata se retira en el día.'],
 riesgo:['Riesgo','Cuánto puede subir y bajar el valor de tu inversión de un día para otro. Más riesgo suele significar más rendimiento posible, pero también más chances de ver pérdidas por un tiempo.'],
 caida:['Peor caída','En el último año, lo máximo que llegó a estar abajo comparado con su mejor momento anterior. Muestra cuánto te hubiera tocado aguantar en el peor momento.'],
 costo:['Costo anual','Lo que cobran la administradora y el banco custodio por año, como porcentaje de tu plata. Ya está descontado del rendimiento que ves.'],
 clase:['Clases','Un mismo fondo puede tener varias "clases" con distintos costos o montos mínimos, por ejemplo una para personas y otra para empresas. Invierten exactamente en lo mismo.'],
 flujo:['Plata que entró o salió','Lo que la gente puso menos lo que retiró. Si entra mucha plata, más gente confía en el fondo; si sale, la gente está retirándose.'],
 vencimiento:['Vencimiento','La fecha en que un bono o letra devuelve la plata. Cuanto más lejos, más se mueve su precio si cambian las tasas.'],
 inflacion:['Inflación','Cuánto subieron los precios en general. Si tu plata rinde menos que la inflación, con el tiempo te alcanza para comprar menos cosas.'],
};
const T=(k,txt)=>`<button type="button" class="t" data-g="${k}">${txt}</button>`;
function glosa(k,btn){const g=G[k];if(!g)return;const d=$('#glosa');d.querySelector('b').textContent=g[0];d.querySelector('p').textContent=g[1];d.classList.add('abierto');d._btn=btn;d.querySelector('.cerrar').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(b){glosa(b.dataset.g,b);return}
  if(!e.target.closest('#glosa'))$('#glosa').classList.remove('abierto')});
$('#glosa .cerrar').onclick=()=>{const d=$('#glosa');d.classList.remove('abierto');d._btn&&d._btn.focus()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#glosa').classList.remove('abierto')});

/* ---------- Marca blanca por URL ---------- */
if(Q.get('marca'))$('#marca').textContent=Q.get('marca');
if(/^#[0-9a-f]{3,8}$/i.test(Q.get('color')||'')){document.documentElement.style.setProperty('--brand',Q.get('color'));document.documentElement.style.setProperty('--accent',Q.get('color'))}
if(EMBED)$('.top').hidden=true;

const OBJ=[['todos','Ver todos','Los fondos de todos los tipos'],['pronto','La voy a usar pronto','Gastos del mes, emergencias'],
 ['anio','Ahorro para el año','Plata que no tocás por meses'],['inflacion','Que no le gane la inflación','Bonos que ajustan por precios'],
 ['dolar','Pensar en dólares','En dólares o atado al dólar'],['largo','Invertir a largo plazo','Varios años, aguanta subas y bajas']];
const RIESGO_TXT=['','Muy bajo: casi no se mueve','Bajo: se mueve poco','Medio: puede bajar algunas semanas','Alto: puede bajar bastante algunos meses','Muy alto: puede caer fuerte y tardar en recuperarse'];
const medidor=(n,grande)=>n?`<span class="riesgo rv${n}${grande?' grande':''}" role="img" aria-label="Riesgo ${n} de 5">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>`:'';

let FERIADOS=new Set(), CAT=null, REF=null, objetivo='todos', texto='', orden='patrimonio', mostrar=30, periodo='1a', monto=100000;
async function cargar(){
  const [c,r,fe]=await Promise.all([fetch(BASE+'catalogo.json').then(x=>x.json()),fetch(BASE+'referencias.json').then(x=>x.json()),
    fetch(BASE+'feriados.json').then(x=>x.ok?x.json():null).catch(()=>null)]);
  CAT=c;REF=r;FERIADOS=new Set((fe&&fe.feriados)||[]);$('#fecha').textContent='Datos al '+fecha(c.fecha);
  window.addEventListener('hashchange',ruta);ruta();
}
function ruta(){const id=Q.get('fondo')||decodeURIComponent(location.hash.slice(1));barra();id==='comparar'?comparar():id?ficha(id):listado()}
/* ---------- Comparar hasta 3 fondos ---------- */
let CMP=[];try{CMP=JSON.parse(localStorage.getItem('fci_comparar')||'[]').slice(0,3)}catch(e){}
const guardarCmp=()=>{try{localStorage.setItem('fci_comparar',JSON.stringify(CMP))}catch(e){}barra()};
function toggleCmp(id){CMP=CMP.includes(id)?CMP.filter(x=>x!==id):[...CMP,id].slice(-3);guardarCmp()}
function barra(){
  let b=$('#cmpbar');if(!b){b=document.createElement('div');b.id='cmpbar';document.body.appendChild(b)}
  b.hidden=EMBED||!CMP.length||location.hash==='#comparar';
  b.innerHTML=`<span>${CMP.length} ${CMP.length===1?'fondo elegido':'fondos elegidos'}</span><a href="#comparar">Comparar</a>`;
  const bt=$('#btncmp');if(bt){const on=CMP.includes(bt.dataset.id);bt.setAttribute('aria-pressed',on);bt.textContent=on?'✓ Elegido para comparar':'＋ Comparar con otros'}
}
async function comparar(){
  document.title='Comparar fondos';
  const volver=`<button class="volver" type="button" id="volver">← Todos los fondos</button>`;
  if(!CMP.length){$('#app').innerHTML=volver+`<p class="vacio">Todavía no elegiste fondos. Entrá a la ficha de un fondo y tocá "Comparar con otros".</p>`;$('#volver').onclick=()=>{location.hash=''};return}
  $('#app').innerHTML='<p class="peq">Cargando…</p>';
  const fs=(await Promise.all(CMP.map(id=>fetch(BASE+'fondos/'+encodeURIComponent(id)+'.json').then(x=>x.ok?x.json():null).catch(()=>null)))).filter(Boolean);

function filtrados(){

/* ---------- Gráfico: cómo evolucionó una inversión contra inflación y dólar ---------- */
function grafico(f){
  const ev=f.evolucion||[];if(ev.length<4)return '';
  const t0=ev[0][0], base=ev[0][1];
  const ref=(s)=>{const p=(s||[]).filter(x=>x[0]>=t0.slice(0,7));if(p.length<3)return null;const b=p[0][1];return p.map(x=>[x[0],x[1]/b*100])};
  const series=[['Este fondo',ev.map(x=>[x[0],x[1]/base*100]),'var(--accent)']];
  if(f.moneda!=='USD'){const c=ref(REF.serie_cer);if(c)series.push(['Inflación',c,'var(--c3)']);}
  const d=ref(REF.serie_dolar);if(d&&f.moneda!=='USD')series.push(['Dólar oficial',d,'var(--c2)']);
  const W=Math.round(Math.max(300,Math.min(640,($('#app').clientWidth||640)-50))),H=Math.round(W*.42)+40,PL=40,PR=10,PT=12,PB=26;
  const ts=s=>Date.parse(s);const x0=ts(t0),x1=Math.max(...series.flatMap(s=>s[1].map(p=>ts(p[0]))));
  const ys=series.flatMap(s=>s[1].map(p=>p[1]));let y0=Math.min(...ys),y1=Math.max(...ys);const pad=(y1-y0)*.08||5;y0-=pad;y1+=pad;
  const X=v=>PL+(ts(v)-x0)/(x1-x0||1)*(W-PL-PR), Y=v=>PT+(1-(v-y0)/(y1-y0))*(H-PT-PB);
  const ticks=4,ty=[...Array(ticks+1)].map((_,i)=>y0+(y1-y0)*i/ticks);
  const xl=[ev[0][0],ev[Math.floor(ev.length/2)][0],ev[ev.length-1][0]];
  const fin=series.map(s=>s[1][s[1].length-1][1]);
  return `<div class="bloque graf"><h3>Si hubieras puesto $100 al principio</h3>
   <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de 100 pesos invertidos en el fondo comparado con inflación y dólar">
    ${ty.map(v=>`<line class="eje" x1="${PL}" x2="${W-PR}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${PL-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v)}</text>`).join('')}
    ${xl.map(v=>`<text x="${X(v)}" y="${H-6}" text-anchor="middle">${mes(v)}</text>`).join('')}
    ${series.map(s=>`<polyline fill="none" stroke="${s[2]}" stroke-width="${s[0]==='Este fondo'?3:2}" stroke-linejoin="round" stroke-linecap="round" points="${s[1].map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}"/>`).join('')}
   </svg>
   <div class="ley2">${series.map((s,i)=>`<span><i style="background:${s[2]}"></i>${s[0]}: <b class="num">${nf(fin[i],0)}</b></span>`).join('')}</div>
   <p class="peq">Desde ${mes(t0)}. Si la línea del fondo termina arriba de la de ${T('inflacion','inflación')}, tu plata ganó poder de compra.</p></div>`;
}

/* Fecha en que cobrás si pedís el rescate hoy: suma días hábiles salteando fines de semana y feriados */
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function cobro(p){
  const n=+p; if(isNaN(n)||p===''||p==null)return '';
  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const habil=d=>d.getDay()%6!==0&&!FERIADOS.has(iso(d));
  const d=new Date();d.setHours(12);
  if(!habil(d))while(!habil(d))d.setDate(d.getDate()+1);
  for(let i=0;i<n;){d.setDate(d.getDate()+1);if(habil(d))i++}
  return n===0?'':`<br><span class="peq">Si la pedís hoy, la cobrás el ${DIAS[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}</span>`;
}

    const filas=[['Este fondo',v,null,true],...refs].filter(r=>r[3]||r[1]!=null);
    const max=Math.max(...filas.map(r=>Math.abs(r[1]||0)),1);
    $('#comp').innerHTML=filas.length>1?filas.map(([nm,x,g,es])=>`<div class="comp-row ${es?'fondo':''}"><span>${g?T(g,nm):nm}</span><span class="track"><span class="fill ${x<0?'neg':''}" style="width:${Math.abs(x||0)/max*100}%"></span></span><span class="num" style="text-align:right">${pct(x)}</span></div>`).join(''):'';
  };
  $$('[data-p]').forEach(b=>b.onclick=()=>{periodo=b.dataset.p;$$('[data-p]').forEach(x=>x.setAttribute('aria-pressed',x===b));pinta()});
  pinta();window.scrollTo(0,0);
}
cargar().catch(()=>{$('#app').innerHTML='<p class="vacio">No se pudieron cargar los datos. Probá de nuevo en un rato.</p>'});
</script>
