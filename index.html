<body>
<header class="top"><div class="top-in"><b id="marca">Fondos explicados</b><nav class="nav" id="nav" aria-label="Secciones"><a href="#" data-n="fondos">Fondos</a><a href="#bonos" data-n="bonos" hidden>Bonos</a></nav><small id="fecha"></small></div></header>
<main id="app"><p class="peq">Cargando fondos…</p></main>
<div id="glosa" class="card" role="dialog" aria-live="polite" aria-label="Qué significa"><button class="cerrar" type="button" aria-label="Cerrar">×</button><b></b><p></p></div>
<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const Q=new URLSearchParams(location.search), EMBED=!!Q.get('embed');
const BASE=window.FONDOS_DATOS||'data/web/';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(v,d=1)=>v==null||isNaN(v)?'s/d':v.toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(v,d=1)=>v==null?'s/d':(v>0?'+':'')+nf(v,d)+'%';
const sim=(v,mon)=>(mon==='USD'?'US$ ':'$ ')+Math.round(v).toLocaleString('es-AR');
const plata=(v,mon)=>{if(v==null)return 's/d';const a=Math.abs(v),s=mon==='USD'?'US$ ':'$ ';
  if(a>=1e12)return s+nf(v/1e12,2)+' billones';if(a>=1e9)return s+nf(v/1e9,1)+' mil millones';if(a>=1e6)return s+nf(v/1e6,1)+' millones';return s+nf(v,0)};
const plazo=p=>p==null||p===''?'s/d':+p===0?'en el día':+p===1?'al día hábil siguiente':'en '+p+' días hábiles';
const horiz={Cor:'corto plazo',Med:'mediano plazo',Lar:'largo plazo',Flex:'cualquier plazo'};
const colores=['var(--accent)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c7)','var(--c8)','var(--c6)'];
const fecha=f=>{if(!f)return '';const [y,m,d]=f.split('-');return d+'/'+m+'/'+y};
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const mes=f=>{const [y,m]=f.split('-');return MESES[+m-1]+' '+y};
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
// "Balanz S.G.F.C.I.S.A.U." -> "Balanz": las siglas legales no le dicen nada a quien empieza
const gestora=s=>{const p=String(s||'').trim().split(/\s+/);while(p.length>1&&/^(?:[SAUGFCI]\.){2,}[SAUGFCI]?\.?$/.test(p[p.length-1]))p.pop();return p.join(' ')};
// Fondos cerrados o en liquidación: no se puede entrar, así que no se ofrecen salvo que se los busque por nombre
const disponible=f=>f.disponible!==false&&!/liquidaci|cerrad|tr[aá]mite/i.test(f.tipo||'');
const MARCA=Q.get('marca')||'';

/* ---------- Glosario: cada término técnico se puede tocar para ver qué significa ---------- */
const G={
 fci:['Fondo común de inversión','Mucha gente pone su plata en un mismo pozo y una empresa especializada (la administradora) la invierte por todos. Cada uno puede sacar su parte cuando quiera, según el plazo del fondo.'],
 administradora:['Administradora','La empresa que decide en qué se invierte la plata del fondo. Cobra un porcentaje por año por hacerlo.'],
 depositaria:['Custodia (depositaria)','Un banco que guarda la plata y los activos del fondo, separados de los de la administradora. Si la administradora tuviera problemas, la plata sigue siendo de los inversores.'],
 rescate:['Rescate','Es sacar tu plata del fondo. El plazo de rescate es cuánto tarda en volver a tu cuenta.'],
 patrimonio:['Patrimonio','La plata total que maneja el fondo, sumando la de todas las personas y empresas que lo eligieron. Cuanto más grande, más gente lo eligió, mejor puede repartir sus inversiones y más fácil le resulta devolver la plata cuando alguien la pide.'],
 cer:['CER (inflación)','Un índice que sigue a la inflación. Un bono "CER" te devuelve tu plata ajustada por inflación más un interés.'],
 lecap:['Lecap (tasa fija)','Letras del Tesoro que pagan una tasa fija acordada de antemano. Ganan más si la inflación termina siendo menor a lo esperado.'],
 tamar:['TAMAR','La tasa que pagan los bancos por plazos fijos grandes. Un bono TAMAR paga intereses que suben o bajan con esa tasa.'],
 linked:['Dólar linked','Bonos en pesos que ajustan por el dólar oficial. Si el dólar sube, suben. Se compran y cobran en pesos.'],
 on:['Obligación negociable (ON)','Un préstamo que le hacés a una empresa: te devuelve la plata con intereses en las fechas pactadas.'],
 caucion:['Caución','Un préstamo de muy corto plazo (de 1 a 7 días) con garantía, que se hace en la bolsa. Es de muy bajo riesgo.'],
 plazofijo:['Plazo fijo','Un depósito en un banco a un plazo y tasa fijos. Los fondos de mercado de dinero tienen muchos, en varios bancos.'],
 premio:['Premio por el riesgo','Cuánto más que un plazo fijo ganó el fondo en el último año, por cada punto que subió y bajó en el camino (los expertos lo llaman índice de Sharpe). Sirve para comparar fondos del mismo tipo: entre dos que ganaron lo mismo, es mejor el que lo logró con menos sobresaltos.'],
 mm:['Money market (mercado de dinero)','Fondos que invierten en lo más seguro y corto: plazos fijos, cuentas remuneradas y cauciones. La plata se retira en el día.'],
 riesgo:['Nivel de riesgo','Cuánto varía el valor de tu inversión en el tiempo. A más riesgo, más potencial de rendimiento, con más subas y bajas en el camino.'],
 caida:['Mayor baja','La mayor diferencia, en el último año, entre el mejor valor del fondo y un valor posterior. Te da una idea de cuánto puede variar en el camino.'],
 costo:['Costo anual','Lo que cobran la administradora y el banco custodio por año, como porcentaje de tu plata. Ya está descontado del rendimiento que ves.'],
 clase:['Clases','Un mismo fondo puede tener varias "clases" con distintos costos o montos mínimos, por ejemplo una para personas y otra para empresas. Invierten exactamente en lo mismo. La clase que te toca la define el banco o broker donde invertís.'],
 flujo:['Plata que entró o salió','Lo que la gente puso menos lo que retiró. Que un día salga plata es normal: la gente usa sus ahorros. Llama la atención solo si sale mucha, comparada con el tamaño del fondo, durante varias semanas.'],
 vencimiento:['Vencimiento','La fecha en que un bono o letra devuelve la plata. Cuanto más lejos, más se mueve su precio si cambian las tasas.'],
 duracion:['Duración','Mide cuánto se mueve el precio de un bono cuando cambian las tasas. Con duración 0,5, si las tasas suben 1 punto el precio baja cerca de 0,5%. Cuanto más corta, menos se mueve.'],
 tir:['Tasa a la que rinden','Lo que ganarías por año si comprás hoy ese bono o letra y lo tenés hasta que vence, con los precios de hoy. No incluye los costos del fondo.'],
 inflacion:['Inflación','Cuánto subieron los precios en general. Si tu plata rinde menos que la inflación, con el tiempo te alcanza para comprar menos cosas.'],
 bono:['Bono o letra','Un préstamo que le hacés al Estado o a una empresa: te devuelve la plata en una fecha (el vencimiento) y te paga intereses. Las letras son bonos de plazo corto.'],
 dual:['Bono dual','Un bono del Tesoro que al final paga lo que más convenga entre dos tasas: una fija y la TAMAR de los bancos.'],
 fideicomiso:['Fideicomiso','Una forma de juntar plata para un fin concreto, por ejemplo financiar créditos o una obra. Algunos fondos ponen una parte ahí.'],
 broker:['Banco o broker (ALyC)','La empresa donde abrís tu cuenta para invertir. Los brokers se llaman ALyC y tienen que estar registrados en la CNV, el organismo del Estado que los controla. Abrir la cuenta suele ser gratis y se hace online.'],
 emergencia:['Fondo de emergencia','Plata guardada para imprevistos: si te quedás sin trabajo, se rompe algo o tenés un gasto de salud. Lo habitual es tener de 3 a 6 meses de gastos, en algo que no baje y que puedas sacar en el día.'],
 suscribir:['Suscribir','Es el nombre técnico de poner plata en un fondo. Sacarla se llama rescatar.'],
 perfil:['Perfil de inversor','Una forma de resumir cuánto riesgo podés aguantar: depende de cuándo vas a necesitar la plata y de cómo te sentís si ves que baja. Los brokers te lo piden antes de invertir.'],
};
const T=(k,txt)=>`<button type="button" class="t" data-g="${k}">${txt}</button>`;
function glosa(k,btn){const g=G[k];if(!g)return;const d=$('#glosa');d.querySelector('b').textContent=g[0];d.querySelector('p').textContent=g[1];d.classList.add('abierto');d._btn=btn;d.querySelector('.cerrar').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(b){glosa(b.dataset.g,b);return}
  if(!e.target.closest('#glosa'))$('#glosa').classList.remove('abierto')});
$('#glosa .cerrar').onclick=()=>{const d=$('#glosa');d.classList.remove('abierto');d._btn&&d._btn.focus()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#glosa').classList.remove('abierto')});

/* ---------- Marca blanca por URL ---------- */
if(Q.get('marca'))$('#marca').textContent=Q.get('marca');
if(/^#[0-9a-f]{3,8}$/i.test(Q.get('color')||'')){document.documentElement.style.setProperty('--brand',Q.get('color'));document.documentElement.style.setProperty('--accent',Q.get('color'))}
if(EMBED)$('.top').hidden=true;

const OBJ=[['todos','Ver todos','Los fondos de todos los tipos'],['pronto','La voy a usar pronto','Gastos del mes, emergencias'],
 ['anio','Ahorro para el año','Plata que no tocás por meses'],['inflacion','Que no le gane la inflación','Bonos que ajustan por precios'],
 ['dolar','Pensar en dólares','En dólares o atado al dólar'],['largo','Invertir a largo plazo','Varios años, aguanta subas y bajas']];
const RIESGO_TXT=['','Muy bajo: estabilidad, ideal para tu liquidez del día a día','Bajo: movimientos suaves y un rendimiento un poco mayor','Medio: equilibrio entre estabilidad y crecimiento','Alto: más potencial de crecimiento, con variaciones en el camino','Muy alto: el mayor potencial de crecimiento, pensado para el largo plazo'];
const medidor=(n,grande)=>n?`<span class="riesgo rv${n}${grande?' grande':''}" role="img" aria-label="Riesgo ${n} de 5">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>`:'';

let RES=null, FERIADOS=new Set(), CAT=null, REF=null, texto='', orden='patrimonio', mostrar=30, periodo='1a', monto=100000;
async function cargar(){
  const [c,r,fe,rs]=await Promise.all([fetch(BASE+'catalogo.json').then(x=>x.json()),fetch(BASE+'referencias.json').then(x=>x.json()),
    fetch(BASE+'feriados.json').then(x=>x.ok?x.json():null).catch(()=>null),fetch(BASE+'resumen.json').then(x=>x.ok?x.json():null).catch(()=>null)]);
  RES=rs;
  // Marca blanca: la plataforma puede mostrar solo sus fondos (por id o por administradora)
  const ids=(Q.get('fondos')||'').split(',').map(s=>s.trim()).filter(Boolean), ges=norm(Q.get('gestora')||'');
  if(ids.length||ges){const set=new Set(ids);c.fondos=c.fondos.filter(f=>set.has(f.id)||(ges&&norm(f.gerente).includes(ges)));c.cantidad=c.fondos.length}
  CAT=c;REF=r;FERIADOS=new Set((fe&&fe.feriados)||[]);$('#fecha').textContent='Datos al '+fecha(c.fecha);
  // Bonos y administradoras no compiten con la entrada principal: viven en "Para curiosos", al pie
  $('#nav').hidden=true;
  window.addEventListener('hashchange',ruta);ruta();
}
function ruta(){const id=Q.get('fondo')||decodeURIComponent(location.hash.slice(1));const enBonos=id==='bonos'||id.startsWith('bonos/');
  $$('#nav a').forEach(a=>{if(a.dataset.n===(enBonos?'bonos':'fondos'))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  barra();enBonos?bonos(id.slice(6)):id==='comparar'?comparar():id==='gestoras'?gestoras():id?ficha(id):listado()}
/* ---------- Comparar hasta 3 fondos ---------- */
let CMP=[];try{CMP=JSON.parse(localStorage.getItem('fci_comparar')||'[]').slice(0,3)}catch(e){}
const guardarCmp=()=>{try{localStorage.setItem('fci_comparar',JSON.stringify(CMP))}catch(e){}barra()};
function toggleCmp(id){CMP=CMP.includes(id)?CMP.filter(x=>x!==id):[...CMP,id].slice(-3);guardarCmp()}
function barra(){
  let b=$('#cmpbar');if(!b){b=document.createElement('div');b.id='cmpbar';document.body.appendChild(b)}
  b.hidden=EMBED||!CMP.length||location.hash==='#comparar'||location.hash.startsWith('#bonos');
  b.innerHTML=`<span>${CMP.length} ${CMP.length===1?'fondo elegido':'fondos elegidos'}</span><a href="#comparar">Comparar</a>`;
  const bt=$('#btncmp');if(bt){const on=CMP.includes(bt.dataset.id);bt.setAttribute('aria-pressed',on);bt.textContent=on?'✓ Elegido para comparar':'＋ Comparar con otros'}
}
async function comparar(){
  document.title='Comparar fondos';
  const volver=`<button class="volver" type="button" id="volver">← Todos los fondos</button>`;
  if(!CMP.length){$('#app').innerHTML=volver+`<p class="vacio">Todavía no elegiste fondos. Entrá a la ficha de un fondo y tocá "Comparar con otros".</p>`;$('#volver').onclick=()=>{location.hash=''};return}
  $('#app').innerHTML='<p class="peq">Cargando…</p>';
  const fs=(await Promise.all(CMP.map(id=>fetch(BASE+'fondos/'+encodeURIComponent(id)+'.json').then(x=>x.ok?x.json():null).catch(()=>null)))).filter(Boolean);
  const costo=f=>f.clases.length?Math.min(...f.clases.map(x=>(x.honorarios_gerente||0)+(x.honorarios_depositaria||0))):null;
  const R=(f,k)=>(f.rendimientos||{})[k];
  const mejor=(vals,alto=true)=>{const v=vals.filter(x=>x!=null);if(v.length<2)return -1;const m=alto?Math.max(...v):Math.min(...v);return vals.indexOf(m)};
  const filas=[
    ['Qué es',fs.map(f=>esc(f.tipo))],
    [T('riesgo','Riesgo'),fs.map(f=>f.riesgo_nivel?medidor(f.riesgo_nivel)+' '+f.riesgo_nivel+' de 5':'s/d')],
    ...[['30d','Rindió en 1 mes'],['anio','Rindió en el año'],['1a','Rindió en 12 meses'],['2a','Rindió en 2 años']].map(([k,n])=>{const v=fs.map(f=>R(f,k));const i=mejor(v);return [n,v.map((x,j)=>`<span class="num ${x<0?'neg':''}">${pct(x)}</span>${j===i?' <span class="chip">el que más</span>':''}`)]}),
    [T('caida','Peor caída en 1 año'),fs.map(f=>f.peor_caida_1a==null?'s/d':`<span class="num">${nf(f.peor_caida_1a,1)}%</span>`)],
    [T('costo','Costo anual'),(()=>{const v=fs.map(costo);const i=mejor(v,false);return v.map((x,j)=>`<span class="num">${x==null?'s/d':'desde '+nf(x,2)+'%'}</span>${j===i?' <span class="chip">el más barato</span>':''}`)})()],
    [T('rescate','Te devuelven la plata'),fs.map(f=>plazo(f.plazo_rescate))],
    ['A qué está atada',fs.map(f=>f.cartera?Object.entries(f.cartera.atado).filter(a=>a[0]!=='Efectivo').slice(0,3).map(a=>esc(a[0])+' '+nf(a[1],0)+'%').join('<br>'):'s/d')],
    [T('patrimonio','Tamaño'),fs.map(f=>plata(f.patrimonio,f.moneda))],
  ];
  $('#app').innerHTML=volver+`<h2>Comparar fondos</h2>
   <div class="card scroll cmp"><table><thead><tr><th></th>${fs.map(f=>`<th><a href="#${encodeURIComponent(f.id)}">${esc(f.nombre)}</a><br><button type="button" class="quitar" data-q="${esc(f.id)}">Quitar</button></th>`).join('')}</tr></thead>
   <tbody>${filas.map(r=>`<tr><td>${r[0]}</td>${r[1].map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
   <p class="peq">Rendimientos con costos ya descontados. Comparar fondos de tipos distintos puede confundir: uno de acciones puede rendir más en un año y caer mucho al siguiente. Información educativa: no es una recomendación de inversión.</p>`;
  $('#volver').onclick=()=>{location.hash=''};
  $$('[data-q]').forEach(b=>b.onclick=()=>{toggleCmp(b.dataset.q);comparar()});
}
/* ---------- Carpetas: los mismos fondos agrupados por tipo, por riesgo o por plazo ---------- */
const grupoTipo=f=>{const t=(f.tipo||'')+' '+(f.subtipo||'');
  if(/money market|corto plazo/i.test(t))return 'mm';
  if(/CER|inflaci/i.test(t))return 'cer';
  if(/acciones|renta variable/i.test(t))return 'acciones';
  if(f.moneda==='USD'||/d[oó]lar/i.test(t))return 'dolar';
  if(/renta fija|deuda|pymes|tasa|ASG/i.test(t))return 'pesos';
  return 'mixtos'};
const plazoDe=f=>{const g=grupoTipo(f),t=f.tipo||'';
  if(g==='mm')return 'corto';
  if(g==='acciones'||/mixta|retorno total|infraestructura|bonos del estado en d|empresas en d/i.test(t)||(f.riesgo_nivel||0)>=4)return 'largo';
  return 'mediano'};
const CARPETAS={
  tipo:{nombre:'Por tipo',de:grupoTipo,items:[
    ['mm','Money market','Tu plata disponible al instante, rindiendo todos los días.'],
    ['pesos','Renta fija en pesos','Invertí en bonos y letras en pesos.'],
    ['cer','Ajustados por inflación','Protegé tus ahorros de la suba de precios.'],
    ['dolar','Dólares','Invertí en dólares o cubrite del tipo de cambio.'],
    ['acciones','Acciones','Sumate al crecimiento de las empresas.'],
    ['mixtos','Mixtos','Diversificá en un solo fondo.']]},
  riesgo:{nombre:'Por riesgo',de:f=>String(f.riesgo_nivel||''),items:[1,2,3,4,5].map(n=>[String(n),'Riesgo '+RIESGO_TXT[n].split(':')[0].toLowerCase(),RIESGO_TXT[n].split(': ')[1].replace(/^./,m=>m.toUpperCase())+'.'])},
  plazo:{nombre:'Por plazo',de:plazoDe,items:[
    ['corto','Corto plazo','Para tu liquidez: la plata que vas a usar pronto.'],
    ['mediano','Mediano plazo','Para tus ahorros de 6 meses a 2 años.'],
    ['largo','Largo plazo','Para hacer crecer tu capital en más de 2 años.']]},
};
let vista='tipo', carpeta=null, perfilF=null;
const PLAZO_TXT={corto:'Corto plazo',mediano:'Mediano plazo',largo:'Largo plazo'};
/* Torta de la cartera. Colores en un orden validado para daltonismo; más de 6 partes se juntan en "Otros". */
const PALETA_TORTA=['var(--accent)','var(--c3)','var(--c2)','var(--c5)','var(--c7)','var(--c4)'];
function partesTorta(atado){
  const pos=atado.filter(a=>a[1]>0).sort((a,b)=>b[1]-a[1]);
  const ps=pos.length>6?[...pos.slice(0,5),['Otros',pos.slice(5).reduce((t,a)=>t+a[1],0)]]:pos;
  return ps.map((a,i)=>({n:a[0],v:a[1],col:a[0]==='Otros'&&pos.length>6?'var(--c6)':PALETA_TORTA[i]}));
}
function torta(partes,centro){
  const tot=partes.reduce((t,x)=>t+x.v,0)||1, R=62, C=2*Math.PI*R; let ac=0;
  const seg=partes.map((x,i)=>{const len=x.v/tot*C, d=`<circle class="seg" data-i="${i}" r="${R}" cx="90" cy="90" fill="none" stroke="${x.col}" stroke-width="30"
      stroke-dasharray="${Math.max(len-2,.5).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-ac).toFixed(2)}"><title>${esc(x.n)}: ${nf(x.v,1)}%</title></circle>`;ac+=len;return d}).join('');
  return `<svg viewBox="0 0 180 180" class="torta-svg" role="img" aria-label="Composición de la cartera: ${esc(partes.map(x=>x.n+' '+nf(x.v,0)+'%').join(', '))}">
    <g transform="rotate(-90 90 90)">${seg}</g>
    <text x="90" y="86" text-anchor="middle" class="t1" data-c1>${esc(centro[0])}</text><text x="90" y="106" text-anchor="middle" class="t2" data-c2>${esc(centro[1])}</text></svg>`;
}
function filtrados(){
  const t=norm(texto);
  let l;
  if(t)l=CAT.fondos.filter(f=>norm(f.nombre+' '+f.gerente+' '+f.tipo).includes(t));
  else if(perfilF)l=delPerfil(perfilF);
  else l=CAT.fondos.filter(f=>disponible(f)&&(!carpeta||CARPETAS[vista].de(f)===carpeta));
  if(orden==='rend')l=[...l].sort((a,b)=>(b.rend_1a??-1e9)-(a.rend_1a??-1e9));
  if(orden==='premio')l=[...l].sort((a,b)=>(b.premio??-1e9)-(a.premio??-1e9));
  if(orden==='riesgo')l=[...l].sort((a,b)=>(a.riesgo_nivel??9)-(b.riesgo_nivel??9)||b.patrimonio-a.patrimonio);
  return l;
}
/* ---------- Perfil del inversor: 4 preguntas, de a una, tocando un cajón ---------- */
const PREG=[
 ['colchon','¿Ya tenés un ahorro para imprevistos?',[['si','Sí, ya lo tengo'],['no','Todavía no']]],
 ['cuando','¿Cuándo pensás usar esta plata?',[['ya','En semanas'],['meses','En menos de un año'],['anios','En 1 a 3 años'],['largo','En más de 3 años']]],
 ['baja','Si tu inversión baja un 10% en un mes, ¿qué hacés?',[['saco','Rescato'],['espero','Espero a que se recupere'],['tranqui','Aprovecho e invierto más']]],
 ['moneda','¿En qué moneda querés invertir?',[['pesos','En pesos'],['dolares','En dólares']]],
];
function resultadoTest(r){
  if(r.colchon==='no'||r.cuando==='ya')return {nombre:'Muy conservador',tope:1,plazos:['corto'],moneda:r.moneda||'pesos',
    txt:`Arrancá por tu ${T('emergencia','ahorro de emergencia')} en un money market: tu plata disponible al instante y rindiendo todos los días.`};
  const aguanta={saco:0,espero:1,tranqui:2}[r.baja], plazo={meses:0,anios:1,largo:2}[r.cuando], n=Math.min(aguanta,plazo);
  return Object.assign({moneda:r.moneda},[
    {nombre:'Conservador',tope:2,plazos:['corto','mediano'],txt:'Priorizás la estabilidad de tu inversión.'},

/* ---------- Gráfico: cómo evolucionó una inversión contra inflación y dólar ---------- */
function grafico(f){
  const ev=f.evolucion||[];if(ev.length<4)return '';
  const t0=ev[0][0], base=ev[0][1];
  const ref=(s)=>{const p=(s||[]).filter(x=>x[0]>=t0.slice(0,7));if(p.length<3)return null;const b=p[0][1];return p.map(x=>[x[0],x[1]/b*100])};
  const series=[['Este fondo',ev.map(x=>[x[0],x[1]/base*100]),'var(--accent)']];
  if(f.moneda!=='USD'){const c=ref(REF.serie_cer);if(c)series.push(['Inflación',c,'var(--c3)']);}
  const d=ref(REF.serie_dolar);if(d&&f.moneda!=='USD')series.push(['Dólar oficial',d,'var(--c2)']);
  const W=Math.round(Math.max(300,Math.min(640,($('#app').clientWidth||640)-50))),H=Math.round(W*.42)+40,PL=40,PR=10,PT=12,PB=26;
  const ts=s=>Date.parse(s);const x0=ts(t0),x1=Math.max(...series.flatMap(s=>s[1].map(p=>ts(p[0]))));
  const ys=series.flatMap(s=>s[1].map(p=>p[1]));let y0=Math.min(...ys),y1=Math.max(...ys);const pad=(y1-y0)*.08||5;y0-=pad;y1+=pad;
  const X=v=>PL+(ts(v)-x0)/(x1-x0||1)*(W-PL-PR), Y=v=>PT+(1-(v-y0)/(y1-y0))*(H-PT-PB);
  const ticks=4,ty=[...Array(ticks+1)].map((_,i)=>y0+(y1-y0)*i/ticks);
  const xl=[ev[0][0],ev[Math.floor(ev.length/2)][0],ev[ev.length-1][0]];
  const fin=series.map(s=>s[1][s[1].length-1][1]);
  return `<div class="bloque graf"><h3>Si hubieras invertido $100 al principio</h3>
   <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de 100 pesos invertidos en el fondo comparado con inflación y dólar">
    ${ty.map(v=>`<line class="eje" x1="${PL}" x2="${W-PR}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${PL-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v)}</text>`).join('')}
    ${xl.map(v=>`<text x="${X(v)}" y="${H-6}" text-anchor="middle">${mes(v)}</text>`).join('')}
    ${series.map(s=>`<polyline fill="none" stroke="${s[2]}" stroke-width="${s[0]==='Este fondo'?3:2}" stroke-linejoin="round" stroke-linecap="round" points="${s[1].map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}"/>`).join('')}
   </svg>
   <div class="ley2">${series.map((s,i)=>`<span><i style="background:${s[2]}"></i>${s[0]}: <b class="num">${nf(fin[i],0)}</b></span>`).join('')}</div>
   <p class="peq">Desde ${mes(t0)}. Si la línea del fondo termina arriba de la de ${T('inflacion','inflación')}, tu plata ganó poder de compra.</p></div>`;
}

/* Fecha en que cobrás si pedís el rescate hoy: suma días hábiles salteando fines de semana y feriados */
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function cobro(p){
  const n=+p; if(isNaN(n)||p===''||p==null)return '';
  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const habil=d=>d.getDay()%6!==0&&!FERIADOS.has(iso(d));
  const d=new Date();d.setHours(12);
  if(!habil(d))while(!habil(d))d.setDate(d.getDate()+1);
  for(let i=0;i<n;){d.setDate(d.getDate()+1);if(habil(d))i++}
  return n===0?'':`<br><span class="peq">Si la pedís hoy, la cobrás el ${DIAS[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}</span>`;
}

  else if(arriba(a))ok('Le fue bien en el último año',`En 12 meses rindió más que la mitad de los fondos parecidos (n.º ${a.puesto} de ${a.de}).${b?` Mirando 2 años quedó n.º ${b.puesto} de ${b.de}.`:''}`);

      ${d!=null?`<p class="veredicto ${d>=0?'pos':'neg'}">${d>=0?'Superó a la inflación':'Quedó debajo de la inflación'}${P.inflacion_hasta?' (medida hasta '+mes(P.inflacion_hasta)+')':''}: para mantener tu poder de compra necesitabas ${sim(monto*(1+P.inflacion/100),f.moneda)}.</p>`:''}
      ${d!=null&&d<0&&(f.riesgo_nivel||9)<=1?`<p class="peq">Es normal en este tipo de fondo: su objetivo es darte disponibilidad inmediata, no superar a la inflación.</p>`:''}`;
    if($('#quepasa'))$('#quepasa').innerHTML=quePasa(f,M);
    const inp=$('#monto');if(inp){inp.onchange=()=>{const m=+inp.value.replace(/\D/g,'');if(m>0){monto=m;pinta()}}}
    const filas=[['Este fondo',v,null,true],...refs].filter(r=>r[3]||r[1]!=null);
    const max=Math.max(...filas.map(r=>Math.abs(r[1]||0)),1);
    $('#comp').innerHTML=filas.length>1?filas.map(([nm,x,g,es])=>`<div class="comp-row ${es?'fondo':''}"><span>${g?T(g,nm):nm}</span><span class="track"><span class="fill ${x<0?'neg':''}" style="width:${Math.abs(x||0)/max*100}%"></span></span><span class="num" style="text-align:right">${pct(x)}</span></div>`).join(''):'';
  };
  $$('[data-p]').forEach(b=>b.onclick=()=>{periodo=b.dataset.p;$$('[data-p]').forEach(x=>x.setAttribute('aria-pressed',x===b));pinta()});
  pinta();window.scrollTo(0,0);
}
/* ---------- Comparador de bonos: tildá dos y miralos lado a lado ---------- */
let BONOS, famB='', textoB='', SELB=[];
const cargarBonos=()=>BONOS!==undefined?Promise.resolve(BONOS):fetch(BASE+'bonos.json').then(x=>x.ok?x.json():null).catch(()=>null).then(j=>BONOS=j);
const FAM_B={'Tasa fija':['Tasa fija','Sabés desde hoy cuánto vas a cobrar en pesos.','Pesos'],
  'Inflación (CER)':['Ajustan por inflación','Tu plata sigue a la inflación y suma una tasa extra.','Pesos, ajustados por inflación (CER)'],
  'Dólar linked':['Atados al dólar','Se pagan en pesos, al valor del dólar oficial.','Pesos, al valor del dólar oficial'],
  'Bonos en dólares':['En dólares','Pagan intereses y capital en dólares.','Dólares']};
const tasaB=b=>({'Tasa fija':nf(b.tasa,1)+'% por año','Inflación (CER)':'Inflación + '+nf(b.tasa,1)+'%','Dólar linked':'Dólar + '+nf(b.tasa,1)+'%','Bonos en dólares':nf(b.tasa,1)+'% por año en US$'}[b.familia]||nf(b.tasa,1)+'%');
const faltaB=d=>d<45?d+' días':d<730?Math.round(d/30.4)+' meses':nf(d/365,1)+' años';
async function bonos(sel){
  document.title='Comparar bonos';
  $('#app').innerHTML='<p class="peq">Cargando bonos…</p>';
  const D=await cargarBonos();
  if(!D||!D.bonos||!D.bonos.length){$('#app').innerHTML='<button class="volver" type="button" id="volver">← Todos los fondos</button><p class="vacio">Todavía no tenemos los precios de los bonos. Volvé mañana.</p>';$('#volver').onclick=()=>{location.hash=''};return}
  const por=Object.fromEntries(D.bonos.map(b=>[b.ticker,b]));
  if(sel)SELB=sel.split(',').map(s=>s.trim().toUpperCase()).filter(t=>por[t]).slice(0,2);
  $('#app').innerHTML=`<button class="volver" type="button" id="volver">← Todos los fondos</button>
  <section class="hero"><h1>Compará bonos</h1>
    <p>Tildá dos y miralos lado a lado: cuánto rinden, cuándo vencen y qué fondos los tienen.</p></section>
  <section id="bcmp" aria-live="polite"></section>
  <section class="bloque bonos">
    <div class="buscar"><input id="qb" type="search" placeholder="Buscá por código o nombre (ej. GD30, Boncer)" aria-label="Buscar bono" value="${esc(textoB)}"></div>
    <div class="tabs" role="group" aria-label="Tipo de bono">${[['','Todos'],...Object.entries(FAM_B).map(([k,v])=>[k,v[0]])].map(([k,n])=>`<button type="button" data-fb="${esc(k)}" aria-pressed="${famB===k}">${n}</button>`).join('')}</div>
    <p class="peq" id="famtxt"></p>
    <div class="card lista" id="listab"></div>
  </section>
  <details class="legal"><summary>Aviso legal</summary><p>Información con fines educativos: no es una recomendación de inversión. Tasas calculadas con precios de cierre de BYMA${D.precios?' ('+esc(D.precios.replace(/^Cierre BYMA del /,''))+')':''}; cambian con cada operación. Tenencias de los fondos según las carteras que informan a la CNV.</p></details>`;
  const marca=()=>history.replaceState(null,'','#bonos'+(SELB.length?'/'+SELB.join(','):''));
  const pintaLista=()=>{
    const t=norm(textoB);
    const ls=D.bonos.filter(b=>(!famB||b.familia===famB)&&(!t||norm(b.ticker+' '+b.nombre).includes(t)));
    $('#famtxt').textContent=famB?FAM_B[famB][1]:'';
    $('#famtxt').hidden=!famB;
    $('#listab').innerHTML=ls.length?ls.map(b=>{const on=SELB.includes(b.ticker),off=!on&&SELB.length>=2;
      return `<label class="item"><input type="checkbox" data-b="${b.ticker}" ${on?'checked':''} ${off?'disabled':''} aria-label="Comparar ${esc(b.ticker)}">
        <span><span class="n">${esc(b.ticker)}</span> <span class="g">${esc(b.nombre)}</span><br><span class="chips"><span class="chip">${esc(FAM_B[b.familia]?FAM_B[b.familia][0]:b.familia)}</span><span class="chip">vence en ${faltaB(b.dias)}</span></span></span>
        <span class="r"><span class="num">${tasaB(b)}</span></span></label>`}).join(''):'<p class="vacio">No encontramos bonos con ese nombre.</p>';
    $$('[data-b]').forEach(i=>i.onchange=()=>{const k=i.dataset.b;SELB=i.checked?[...SELB,k].slice(-2):SELB.filter(x=>x!==k);marca();pintaLista();pintaCmp(SELB.length===2)});
  };
  const pintaCmp=(mover)=>{
    const z=$('#bcmp'),bs=SELB.map(k=>por[k]).filter(Boolean);
    if(bs.length<2){z.innerHTML=bs.length?`<p class="contexto peq">Elegiste <b>${esc(bs[0].ticker)}</b>. Tildá otro para compararlos.</p>`:'';return}
    const [a,b]=bs, igual=a.familia===b.familia;
    const gana=(f,alto)=>{const x=f(a),y=f(b);if(x==null||y==null||x===y)return -1;return (alto?x>y:x<y)?0:1};
    const chip=(i,j,txt)=>i===j?` <span class="chip">${txt}</span>`:'';
    const iT=igual?gana(x=>x.tasa,true):-1, iM=gana(x=>x.md,false);
    const precio=x=>x.precio==null?'s/d':`<span class="num">${x.moneda==='USD'?'US$ ':'$ '}${nf(x.precio,x.precio>=1000?0:2)}</span><br><span class="peq">cada 100 de valor nominal</span>`;
    const fondos=x=>x.fondos_cantidad?`<b>${x.fondos_cantidad} ${x.fondos_cantidad===1?'fondo':'fondos'}</b>${x.fondos_cantidad>1?', los que más tienen:':''}<ul>${x.fondos.slice(0,5).map(f=>`<li><a href="#${encodeURIComponent(f.id)}">${esc(f.nombre)}</a> <span class="num peq">${nf(f.pct,1)}%</span></li>`).join('')}</ul>`:'<span class="peq">Ningún fondo lo informa con este código.</span>';
    const filas=[
      ['Qué es',x=>esc(x.nombre)+'<br><span class="peq">'+esc(FAM_B[x.familia]?FAM_B[x.familia][1]:'')+'</span>'],
      ['Te paga en',x=>esc(FAM_B[x.familia]?FAM_B[x.familia][2]:x.moneda)+(x.ley?`<br><span class="peq">Ley ${x.ley==='NY'?'Nueva York':/^arg/i.test(x.ley)?'argentina':esc(x.ley)}</span>`:'')],
      ['Precio',precio],
      [T('tir','Tasa a la que rinde'),(x,i)=>`<span class="num">${tasaB(x)}</span>${chip(i,iT,'rinde más')}`],
      [T('duracion','Duración'),(x,i)=>x.md==null?'s/d':`<span class="num">${nf(x.md,2)}</span>${chip(i,iM,'se mueve menos')}`],
      [T('vencimiento','Vence'),x=>`${fecha(x.vto)}<br><span class="peq">en ${faltaB(x.dias)}</span>`],
      ['Fondos que lo tienen',fondos],
    ];
    z.innerHTML=`<div class="card scroll bcmp"><table><thead><tr><th></th>${bs.map(x=>`<th>${esc(x.ticker)}<br><button type="button" class="quitar" data-qb="${x.ticker}">quitar</button></th>`).join('')}</tr></thead>
      <tbody>${filas.map(([n,f])=>`<tr><td>${n}</td>${bs.map((x,i)=>`<td>${f(x,i)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      ${igual?'':`<p class="peq" style="margin-top:8px">Son de tipos distintos, así que la tasa se lee distinto: ${esc(a.ticker)} rinde ${esc(a.tasa_tipo||'')} y ${esc(b.ticker)}, ${esc(b.tasa_tipo||'')}.</p>`}`;
    $$('[data-qb]').forEach(q=>q.onclick=()=>{SELB=SELB.filter(x=>x!==q.dataset.qb);marca();pintaLista();pintaCmp()});
    if(mover)z.scrollIntoView({behavior:'smooth',block:'start'});
  };
  $('#volver').onclick=()=>{location.hash=''};
  $('#qb').oninput=e=>{textoB=e.target.value;pintaLista()};
  $$('[data-fb]').forEach(x=>x.onclick=()=>{famB=x.dataset.fb;$$('[data-fb]').forEach(y=>y.setAttribute('aria-pressed',y===x));pintaLista()});
  pintaLista();pintaCmp();window.scrollTo(0,0);
}
cargar().catch(()=>{$('#app').innerHTML='<p class="vacio">No se pudieron cargar los datos. Probá de nuevo en un rato.</p>'});
</script>
