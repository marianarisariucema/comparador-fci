<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fondos explicados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Módulo marca blanca: lista de fondos + ficha didáctica. Marca y color se cambian por URL:
   ?marca=Mi%20Broker&color=%230f6b5c  ·  ficha sola para embeber: ?fondo=fima-premium&embed=1 */
:root{
  --bg:#f3f5f4; --surface:#fff; --ink:#15201c; --muted:#5b6964; --line:#dde3e0;
  --brand:#0f6b5c; --brand-soft:#e3f1ed; --good:#1d7a45; --bad:#b4372b; --warn:#a36a00;
  --c2:#3f8fd1; --c3:#d39a2b; --c4:#8a5cc2; --c5:#c4553d; --c6:#7a8a84; --c7:#2f9e8f; --c8:#b07aa1;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#17201d; --ink:#e7eeeb; --muted:#9aaba5; --line:#2a3632;
  --brand-soft:#173430; --good:#5cc98a; --bad:#ef7d70; --warn:#e3b04f;
  --c2:#6fb2ec; --c3:#e3b04f; --c4:#b18ae6; --c5:#ef7d70; --c6:#93a39d; --c7:#5fc7b8; --c8:#d39ac4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#17201d; --ink:#e7eeeb; --muted:#9aaba5; --line:#2a3632;
  --brand-soft:#173430; --good:#5cc98a; --bad:#ef7d70; --warn:#e3b04f;
  --c2:#6fb2ec; --c3:#e3b04f; --c4:#b18ae6; --c5:#ef7d70; --c6:#93a39d; --c7:#5fc7b8; --c8:#d39ac4; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.top{background:var(--brand);color:#fff;padding:14px max(16px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:12px}
.top b{font-weight:700;letter-spacing:.02em;font-size:1.05rem}
.top small{opacity:.85}
main{max-width:900px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) 48px;display:grid;gap:18px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:1.5rem}h2{font-size:1.35rem}
h3{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.peq{color:var(--muted);font-size:.86rem}
.buscar{display:grid;gap:10px}
.buscar input{font:inherit;width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.buscar input:focus{outline:2px solid var(--brand);outline-offset:1px}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.filtros button,.tabs button,.mas{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.filtros button[aria-pressed="true"],.tabs button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);font-weight:600;background:var(--brand-soft)}
.orden{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.orden select{font:inherit;font-size:.85rem;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.lista{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:12px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.item:last-child{border-bottom:0}
.item:hover{background:var(--brand-soft)}
.item:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.item .n{font-weight:600}
.item .g{color:var(--muted);font-size:.82rem}
.item .r{text-align:right;grid-row:span 2;align-self:center}
.item .r .num{font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;grid-column:1}
.chip{font-size:.72rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.r-bajo{color:var(--good);border-color:currentColor}.chip.r-medio{color:var(--warn);border-color:currentColor}.chip.r-alto{color:var(--bad);border-color:currentColor}
.mas{justify-self:center}
.volver{font:inherit;background:none;border:0;color:var(--brand);cursor:pointer;padding:0;font-weight:600;justify-self:start}
.ficha{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 18px;display:grid;gap:26px}
.cab{display:grid;gap:6px}
.frase{font-size:1.1rem;line-height:1.45;max-width:62ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:22px}
.bloque{display:grid;gap:10px;align-content:start;min-width:0}
.dato{font-size:1.5rem;font-weight:600}
.barra{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.barra span{display:block;height:100%}
.leyenda{display:grid;gap:6px;font-size:.88rem}
.leyenda div{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center}
.leyenda i{width:12px;height:12px;border-radius:3px;display:block}
table{width:100%;border-collapse:collapse;font-size:.88rem}
td,th{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
td:last-child,th:last-child{text-align:right;padding-left:12px}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
.scroll table{min-width:520px}
.comp{display:grid;gap:8px}
.comp-row{display:grid;grid-template-columns:minmax(100px,170px) 1fr 70px;gap:10px;align-items:center;font-size:.88rem}
.track{height:12px;background:var(--line);border-radius:6px;position:relative;overflow:hidden}
.fill{position:absolute;top:0;bottom:0;left:0;border-radius:6px;background:var(--c6)}
.comp-row.fondo .fill{background:var(--brand)}
.fill.neg{background:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.flujo.pos{color:var(--good)}.flujo.neg{color:var(--bad)}
.aviso{font-size:.76rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.vacio{padding:24px 16px;color:var(--muted)}
footer{font-size:.76rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.barra span,.fill{transition:width .4s ease}}
</style>
</head>
<body>
<header class="top"><b id="marca">Fondos explicados</b><small id="fecha"></small></header>
<main id="app"><p class="peq">Cargando fondos…</p></main>
<script>
const $=s=>document.querySelector(s);
const Q=new URLSearchParams(location.search);
const BASE='data/web/';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(v,d=1)=>v==null?'s/d':v.toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(v,d=1)=>v==null?'s/d':(v>0?'+':'')+nf(v,d)+'%';
const plata=(v,mon)=>{if(v==null)return 's/d';const a=Math.abs(v),s=mon==='USD'?'US$ ':'$ ';
  if(a>=1e12)return s+nf(v/1e12,2)+' billones';if(a>=1e9)return s+nf(v/1e9,1)+' mil millones';if(a>=1e6)return s+nf(v/1e6,1)+' millones';return s+nf(v,0)};
const plazo=p=>p==null||p===''?'s/d':p==0||p==='0'?'en el día':p==1||p==='1'?'al día siguiente hábil':'en '+p+' días hábiles';
const horiz={Cor:'corto plazo',Med:'mediano plazo',Lar:'largo plazo',Flex:'cualquier plazo'};
const colores=['var(--brand)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c7)','var(--c8)','var(--c6)'];
const fecha=f=>{if(!f)return '';const [y,m,d]=f.split('-');return d+'/'+m+'/'+y};
const FILTROS=[['todos','Todos',()=>true],['mm','Money market',f=>/Money market|corto plazo/.test(f.subtipo)],
  ['cer','Inflación (CER)',f=>/CER/.test(f.subtipo)],['fija','Tasa fija y pesos',f=>/tasa fija|pesos|TAMAR/i.test(f.subtipo)],
  ['usd','Dólares',f=>f.moneda==='USD'||/dólar/i.test(f.subtipo)],['acc','Acciones',f=>/Acciones/.test(f.subtipo)],
  ['mixta','Mixtos',f=>/mixta/i.test(f.subtipo)]];

// Marca blanca por URL
if(Q.get('marca'))$('#marca').textContent=Q.get('marca');
if(/^#[0-9a-f]{3,8}$/i.test(Q.get('color')||''))document.documentElement.style.setProperty('--brand',Q.get('color'));
if(Q.get('embed'))$('.top').hidden=true;

let CAT=null, REF=null, filtro='todos', texto='', orden='patrimonio', mostrar=40, periodo='1a';
async function cargar(){
  const [c,r]=await Promise.all([fetch(BASE+'catalogo.json').then(x=>x.json()),fetch(BASE+'referencias.json').then(x=>x.json())]);
  CAT=c;REF=r;$('#fecha').textContent='Datos al '+fecha(c.fecha);
  window.addEventListener('hashchange',ruta);ruta();
}
function ruta(){
  const id=Q.get('fondo')||decodeURIComponent(location.hash.slice(1));
  id?ficha(id):listado();
}
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function filtrados(){
  const fn=FILTROS.find(f=>f[0]===filtro)[2], t=norm(texto);
  let l=CAT.fondos.filter(f=>fn(f)&&(!t||norm(f.nombre+' '+f.gerente).includes(t)));
  if(orden==='rend')l=[...l].sort((a,b)=>(b.rend_1a??-1e9)-(a.rend_1a??-1e9));
  return l;
}
function listado(){
  document.title='Fondos explicados';
  $('#app').innerHTML=`
  <section class="buscar">
    <h1>¿Qué es cada fondo?</h1>
    <p class="peq">${CAT.cantidad.toLocaleString('es-AR')} fondos comunes de inversión explicados en simple: en qué invierten, a qué está atada tu plata y cómo les fue.</p>
    <input id="q" type="search" placeholder="Buscá por fondo o administradora" aria-label="Buscar fondo" value="${esc(texto)}">
    <div class="filtros" role="group" aria-label="Tipo de fondo">${FILTROS.map(f=>`<button type="button" data-f="${f[0]}" aria-pressed="${filtro===f[0]}">${f[1]}</button>`).join('')}</div>
  </section>
  <div class="orden"><span class="peq" id="cuantos"></span>
    <label class="peq">Ordenar por <select id="ord"><option value="patrimonio">Tamaño</option><option value="rend">Rendimiento 12 meses</option></select></label></div>
  <div class="lista" id="lista"></div>
  <button class="mas" id="mas" type="button" hidden>Ver más fondos</button>
  <footer>Fuentes oficiales: CAFCI, CNV, BCRA, ArgentinaDatos y BYMA. Información con fines educativos, no es una recomendación de inversión.</footer>`;
  $('#ord').value=orden;
  $('#q').oninput=e=>{texto=e.target.value;mostrar=40;filas()};
  $('#ord').onchange=e=>{orden=e.target.value;filas()};
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filtro=b.dataset.f;mostrar=40;
    document.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b));filas()});
  $('#mas').onclick=()=>{mostrar+=40;filas()};
  filas();
}
function filas(){
  const l=filtrados();
  $('#cuantos').textContent=l.length.toLocaleString('es-AR')+' fondos';
  $('#lista').innerHTML=l.length?l.slice(0,mostrar).map(f=>`<a class="item" href="#${encodeURIComponent(f.id)}">
    <span><span class="n">${esc(f.nombre)}</span><br><span class="g">${esc(f.gerente||'')}</span></span>
    <span class="r"><span class="num ${f.rend_1a<0?'flujo neg':''}">${pct(f.rend_1a)}</span><br><span class="g">12 meses</span></span>
    <span class="chips"><span class="chip">${esc(f.tipo)}</span><span class="chip">${f.moneda==='USD'?'Dólares':'Pesos'}</span><span class="chip">Rescate ${plazo(f.plazo_rescate)}</span>${f.riesgo?`<span class="chip r-${f.riesgo}">Riesgo ${f.riesgo}</span>`:''}</span></a>`).join('')
    :'<p class="vacio">No encontramos fondos con ese nombre.</p>';
  $('#mas').hidden=l.length<=mostrar;
}
async function ficha(id){
  $('#app').innerHTML='<p class="peq">Cargando ficha…</p>';
  let f;
  try{f=await fetch(BASE+'fondos/'+encodeURIComponent(id)+'.json').then(x=>{if(!x.ok)throw 0;return x.json()})}
  catch(e){$('#app').innerHTML=`${Q.get('embed')?'':'<button class="volver" onclick="location.hash=\'\'">← Todos los fondos</button>'}<p class="vacio">No encontramos ese fondo.</p>`;return}
  document.title=f.nombre+' · Fondos explicados';
  const c=f.cartera, R=f.rendimientos||{};
  const costo=f.clases.length?Math.min(...f.clases.map(x=>(x.honorarios_gerente||0)+(x.honorarios_depositaria||0))):null;
  const atado=c?Object.entries(c.atado):[];
  const tot=atado.reduce((s,a)=>s+Math.max(a[1],0),0)||100;
  const fl=f.flujo_30d??f.flujo_dia, flTxt=f.flujo_30d!=null?'el último mes':'el último día hábil';
  $('#app').innerHTML=`
  ${Q.get('embed')?'':'<button class="volver" type="button" id="volver">← Todos los fondos</button>'}
  <article class="ficha">
    <div class="cab"><h2>${esc(f.nombre)}</h2><p class="peq">${esc(f.gerente||'')} · ${esc(f.categoria||'')}</p></div>
    ${f.frase?`<p class="frase">${esc(f.frase)}</p>`:''}
    <div class="grid2">
      <div class="bloque"><h3>Qué tipo de fondo es</h3><p class="dato" style="font-size:1.15rem">${esc(f.tipo)}</p>
        <p class="peq">${esc(f.tipo_explicacion||'')} ${f.horizonte&&horiz[f.horizonte]?'Pensado para '+horiz[f.horizonte]+'.':''}</p></div>
      <div class="bloque"><h3>Cuánto maneja</h3><p class="dato num">${plata(f.patrimonio,f.moneda)}</p>
        <p class="peq">Es el n.º ${f.puesto} de ${f.en_categoria} fondos de su categoría por tamaño.</p></div>
    </div>
    ${c?`<div class="bloque"><h3>A qué está atada tu plata</h3>
      <div class="barra" role="img" aria-label="Composición de la cartera">${atado.filter(a=>a[1]>0).map((a,i)=>`<span style="width:${a[1]/tot*100}%;background:${colores[i%8]}"></span>`).join('')}</div>
      <div class="leyenda">${atado.map((a,i)=>`<div><i style="background:${a[1]>0?colores[i%8]:'transparent'}"></i><span>${esc(a[0])}</span><span class="num">${nf(a[1],1)}%</span></div>`).join('')}</div>
      <p class="peq">Cartera al ${fecha(c.fecha)} publicada por la CNV, con ${c.n_activos} activos.${c.vencimiento_promedio_anios!=null&&c.vencimiento_cobertura_pct>=30?` Lo que tiene fecha de vencimiento (${nf(c.vencimiento_cobertura_pct,0)}% de la cartera) vence en promedio en ${c.vencimiento_promedio_anios<1?nf(c.vencimiento_promedio_anios*12,0)+' meses':nf(c.vencimiento_promedio_anios,1)+' años'}.`:''}</p></div>
    <div class="grid2">
      <div class="bloque"><h3>Lo que más tiene</h3><table><tbody>${c.principales.slice(0,8).map(t=>`<tr><td>${esc(t.activo)}</td><td class="num">${nf(t.pct,2)}%</td></tr>`).join('')}</tbody></table></div>
      <div class="bloque"><h3>Cuánta plata entró o salió</h3>${fl==null?'<p class="peq">Sin dato.</p>':`<p class="dato num flujo ${fl>=0?'pos':'neg'}">${fl>=0?'+':'−'} ${plata(Math.abs(fl),f.moneda)}</p>
        <p class="peq">En ${flTxt} ${fl>=0?'entró':'salió'} esa plata, sin contar lo que ganó o perdió el fondo. Es la diferencia entre lo que la gente puso y lo que retiró.</p>`}</div>
    </div>`:`<div class="bloque"><h3>En qué invierte</h3><p class="peq">La CNV todavía no publicó la cartera de este fondo.</p></div>`}
    <div class="bloque"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><h3>Cómo le fue</h3>
      <div class="tabs" role="group" aria-label="Período">${[['30d','1 mes'],['anio','En el año'],['1a','12 meses'],['2a','2 años']].map(p=>`<button type="button" data-p="${p[0]}" aria-pressed="${periodo===p[0]}">${p[1]}</button>`).join('')}</div></div>
      <div class="comp" id="comp"></div><p class="peq" id="compTxt"></p></div>
    <div class="bloque"><h3>Datos prácticos</h3><table><tbody>
      <tr><td>Te devuelven la plata</td><td>${plazo(f.plazo_rescate)}</td></tr>
      <tr><td>Costo anual de administración</td><td class="num">${costo==null?'s/d':(f.clases.length>1?'desde ':'')+nf(costo,2)+'%'}</td></tr>
      <tr><td>Quién custodia la plata</td><td>${esc(f.depositaria||'s/d')}</td></tr>
      <tr><td>Clases disponibles</td><td class="num">${f.clases.length}</td></tr></tbody></table>
      ${f.clases.length>1?`<div class="scroll"><table><thead><tr><th>Clase</th><th>Costo anual</th><th>Mínimo</th><th>12 meses</th></tr></thead><tbody>${f.clases.map(x=>`<tr><td>${esc(x.nombre.split(' - ').slice(1).join(' - ')||x.nombre)}</td><td class="num">${nf((x.honorarios_gerente||0)+(x.honorarios_depositaria||0),2)}%</td><td class="num">${x.minimo!=null?plata(x.minimo,f.moneda):'s/d'}</td><td class="num">${pct(x.rend_1a)}</td></tr>`).join('')}</tbody></table></div>`:''}</div>
    <p class="aviso">Fuentes: CAFCI (planilla diaria), CNV (cartera semanal), BCRA (inflación, dólar, plazo fijo), ArgentinaDatos (histórico). Rendimientos de la clase de referencia. "A qué está atada tu plata" se calcula en forma automática con la cartera publicada. Rendimientos pasados no garantizan rendimientos futuros. Información con fines educativos; no es una recomendación de inversión.</p>
  </article>`;
  if($('#volver'))$('#volver').onclick=()=>{location.hash=''};
  const comp=()=>{
    const P=REF.periodos[periodo]||{}, v=R[periodo];
    const filas=[['Este fondo',v,true],['Inflación',P.inflacion],['Plazo fijo',P.plazo_fijo],['Dólar oficial',P.dolar]].filter(r=>r[2]||r[1]!=null);
    const max=Math.max(...filas.map(r=>Math.abs(r[1]||0)),1);
    $('#comp').innerHTML=filas.map(([n,x,es])=>`<div class="comp-row ${es?'fondo':''}"><span>${n}</span><span class="track"><span class="fill ${x<0?'neg':''}" style="width:${Math.abs(x||0)/max*100}%"></span></span><span class="num" style="text-align:right">${pct(x)}</span></div>`).join('');
    const d=v!=null&&P.inflacion!=null?v-P.inflacion:null;
    $('#compTxt').textContent=(v==null?'No hay datos del fondo para este período. ':d!=null?`${d>=0?'Le ganó':'Le perdió'} a la inflación por ${nf(Math.abs(d),1)} puntos. `:'')+
      (P.inflacion_hasta?`Inflación hasta ${fecha(P.inflacion_hasta).slice(3)} (último dato del INDEC vía BCRA).`:'');
  };
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{periodo=b.dataset.p;document.querySelectorAll('[data-p]').forEach(x=>x.setAttribute('aria-pressed',x===b));comp()});
  comp();window.scrollTo(0,0);
}
cargar().catch(()=>{$('#app').innerHTML='<p class="vacio">No se pudieron cargar los datos. Probá de nuevo en un rato.</p>'});
</script>
</body>
</html>
